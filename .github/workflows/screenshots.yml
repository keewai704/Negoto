name: Screenshots

# Runs the UI test that walks through every screen on an iPad and an iPhone simulator,
# in portrait and landscape, and publishes the screenshots to the `screenshots` branch.
on:
  push:
    branches: [main]
    paths: ["Negoto/**", "NegotoUITests/**", "project.yml", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulators
        id: sims
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          devs = [d for rt, ds in json.load(open("devices.json"))["devices"].items() if "iOS" in rt for d in ds]
          def pick(pred):
              matches = [d for d in devs if pred(d["name"])]
              return matches[-1]["udid"] if matches else ""
          print("ipad=" + (pick(lambda n: n.startswith("iPad Pro") and "13" in n) or pick(lambda n: n.startswith("iPad"))))
          print("iphone=" + (pick(lambda n: n.startswith("iPhone") and n.endswith("Pro")) or pick(lambda n: n.startswith("iPhone"))))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Negoto.xcodeproj -scheme Negoto \
            -destination "platform=iOS Simulator,id=${{ steps.sims.outputs.ipad }}" \
            -derivedDataPath build -skipPackagePluginValidation | tail -5

      - name: Run on iPad
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project Negoto.xcodeproj -scheme Negoto \
            -destination "platform=iOS Simulator,id=${{ steps.sims.outputs.ipad }}" \
            -derivedDataPath build -resultBundlePath results/ipad.xcresult -only-testing:NegotoUITests | tail -20

      - name: Run on iPhone
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project Negoto.xcodeproj -scheme Negoto \
            -destination "platform=iOS Simulator,id=${{ steps.sims.outputs.iphone }}" \
            -derivedDataPath build -resultBundlePath results/iphone.xcresult -only-testing:NegotoUITests | tail -20

      - name: Export screenshots
        run: |
          python3 scripts/export_screenshots.py shots results/*.xcresult
          ls -la shots

      - name: Publish to the screenshots branch
        run: |
          cd shots
          {
            echo "# Screenshots"
            echo
            echo "Generated by the Screenshots workflow from ${GITHUB_SHA}."
            echo
            for f in *.png; do echo "## ${f%.png}"; echo; echo "![${f}](${f})"; echo; done
          } > README.md
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b screenshots
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
