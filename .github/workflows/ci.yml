name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Test NegotoCore
        run: swift test --package-path NegotoCore

  ios:
    name: iOS build
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Test NegotoCore (macOS)
        run: swift test --package-path NegotoCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project Negoto.xcodeproj \
            -scheme Negoto \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*NegotoCore|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Negoto.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          IPA="Negoto-${{ steps.version.outputs.version }}.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          ls -la "$IPA"
          plutil -p "Payload/Negoto.app/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Negoto-ipa
          path: Negoto-*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  release:
    name: Release
    needs: [core-linux, ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Negoto-ipa
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.ios.outputs.tag }}
          name: Negoto ${{ needs.ios.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Negoto-*.ipa
          make_latest: true
          generate_release_notes: true
          body: |
            iPhone / iPad 用の Negoto ${{ needs.ios.outputs.version }} です。

            `Negoto-${{ needs.ios.outputs.version }}.ipa` は署名されていない IPA です。AltStore / SideStore / Sideloadly などで
            ご自身の Apple ID で署名してインストールしてください（詳しくは README を参照）。
