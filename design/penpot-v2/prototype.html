ize:12px;color:var(--blue);margin-bottom:48px}.word{font-size:36px;letter-spacing:-1px;overflow-wrap:anywhere;max-width:100%;font-weight:700;margin:0 0 15px}.pronunciation{font-size:14px;color:var(--muted);margin-bottom:25px}.translation{font-size:24px;border-top:1px solid var(--line);width:100%;padding-top:24px;margin:28px 0 12px}.example{font-size:12px;color:var(--muted)}.reviewwrap{max-width:760px;margin:auto}.progress{height:4px;background:var(--line);border-radius:4px;margin:12px 0 24px}.progress i{display:block;height:100%;width:38%;background:var(--blue);border-radius:4px}.rating{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:28px}.rating button{font-size:13px;min-height:66px;padding:10px 3px;font-weight:600}.rating small{display:block;font-size:11px;font-weight:400;margin-bottom:8px;color:var(--muted)}.rating button:nth-child(1){background:#fcecef;color:#b73d4a}.rating button:nth-child(2){background:#fff2df;color:#9b5a16}.rating button:nth-child(3){background:#e8f5ef;color:#19765c}.rating button:nth-child(4){background:var(--tint);color:var(--blue)}.reviewtools{display:flex;justify-content:center;gap:16px;margin-top:20px}.reviewtools button{font-size:12px;background:none;color:var(--muted)}.field{display:grid;gap:10px;margin:22px 0}.field label{font-size:12px;font-weight:600;color:var(--muted)}.field textarea,.field input{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:64px;resize:vertical;min-width:0;width:100%}.editgrid{display:grid;gap:24px}.editpreview{display:none}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar button{flex:1;background:var(--surface);font-size:13px;padding:8px}.settings{max-width:720px}.settings h2{font-size:12px;color:var(--muted);margin:24px 0 12px}.setting{width:100%;border-bottom:1px solid var(--line);border-radius:0;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px;gap:20px}.setting span <div class="reviewbar"><span>デザインプレビュー · 学習データはサンプル</span><label>画面<select id="screenSelect" aria-label="画面を選択"><option value="deck">デッキ</option><option value="review">学習</option><option value="browse">ブラウズ</option><option value="editor">ノート編集</option><option value="stats">統計</option><option value="settings">設定</option><option value="catalog">全81画面</option></select></label><div><button id="theme" aria-label="ダーク表示を切り替え">◐</button><button id="textsize" aria-label="大きな文字を切り替え">Aa</button><span id="widthLabel"></span></div></div>
<div class="app"><aside class="sidebar" aria-label="サイドバー"><div class="wordmark">negoto</div><small>毎日の記憶を、少しずつ。</small><div id="sidenav"></div><h4>マイデッキ</h4><button class="decklink" data-go="review">英語・毎日のことば</button><button class="decklink" data-go="review">日本史</button><button class="decklink" data-go="review">からだのしくみ</button><div class="sidebottom"><button data-toast="同期のサンプル：すべての変更を保存しました">↻ AnkiWebと同期</button><span>個人プロフィール<br>最終同期 9:38</span></div></aside><div class="workspace"><div class="status"><strong>9:41</strong><span>Wi-Fi · 100%</span></div><header><h1 id="pageTitle">デッキ</h1><button data-go="editor" aria-label="ノートを追加">＋</button></header><main id="main"></main></div></div><nav class="tabs" id="tabs" aria-label="メインナビゲーション"></nav><div class="toast" role="status" id="toast"></div>
<script>
const paths={deck:'M4 7h16v13H4z M7 4h10 M8 11h8 M8 15h5',browse:'M16 16l5 5 M18 10a8 8 0 1 1-16 0a8 8 0 1 1 16 0',stats:'M4 20V11h3v9 M10 20V4h3v16 M16 20V8h3v12',settings:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2'};
const icon=(key)=>`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[key]||paths.deck}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const names={deck:'デッキ',browse:'ブラウズ',stats:'統計',settings:'設定',review:'学習',editor:'ノートを編集',catalog:'すべての画面'};
let current='deck',revealed=false,period='30日',selected='serendipity';
const vocab=[['serendipity','思いがけない幸運'],['resilience','立ち直る力'],['ephemeral','つかの間の'],['curiosity','好奇心'],['tranquil','穏やかな'],['perspective','ものの見方']];
const heat=()=>'<div class="heat" aria-label="過去45日の学習カレンダー（サンプル）">'+Array.from({length:45},(_,i)=>`<i style="background:${['var(--line)','var(--tint)','var(--blue)','#e8f5ef','var(--green)'][i*7%5]}" title="${i+1}日目：${i*11%87}回答"></i>`).join('')+'</div>';
const metrics=(items)=>'<div class="metrics">'+items.map(([n,l,col])=>`<div class="metric"><strong class="${col||''}">${n}</strong><span>${l}</span></div>`).join('')+'</div>';
function chart(values=[72,94,65,120,87,103,84],labels=['月','火','水','木','金','土','日']){const max=150;return `<svg class="chart" viewBox="0 0 370 200" role="img" aria-label="回答回数。${values.map((v,i)=>labels[i]+v+'回').join('、')}">${[0,75,150].map(v=>`<line x1="30" x2="365" y1="${165-v}" y2="${165-v}" stroke="var(--line)"/><text x="2" y="${170-v}" fill="var(--muted)" font-size="9">${v}</text>`).join('')}${values.map((v,i)=>`<rect x="${43+i*46}" y="${165-v}" width="26" height="${v}" rx="4" fill="var(--blue)"/><rect x="${43+i*46}" y="${165-v}" width="26" height="${v*.25}" rx="4" fill="var(--green)"/><text x="${56+i*46}" y="188" text-anchor="middle" fill="var(--muted)" font-size="11">${labels[i]}</text>`).join('')}</svg>`}
const answers=()=>'<div class="answers">'+[['もう一度',95,'#b73d4a'],['難しい',173,'#9b5a16'],['普通',815,'var(--green)'],['簡単',165,'var(--blue)']].map(([l,n,c])=>`<div class="answerline"><span>${l}</span><i style="background:${c};width:${n/815*100}%"></i><span>${n}</span></div>`).join('')+'</div>';
function deck(){return `<p class="eyebrow">10月6日 火曜日 · おかえりなさい</p><div class="topgrid"><section class="hero"><span>今日の学習</span><div class="big">84<small>枚の復習</small></div><p>新規 20 / 学習中 8 / 約12分</p><button data-go="review">▷ 学習をはじめる</button></section><section class="panel streak"><h2>続けた日々</h2><p>今週は5日、学習しました</p>${heat()}<p style="margin-top:20px">14日連続 · 合計1,248回答</p></section></div><div class="sectionhead"><h2>マイデッキ</h2><button data-go="browse">すべて表示</button></div><div class="decklist">${[['英語・毎日のことば','3つのサブデッキ',48,12,'#245bdb'],['日本史','古代から近現代まで',24,5,'#7652b5'],['からだのしくみ','画像とことばで学ぶ',12,3,'#19765c']].map(([t,s,d,n,col])=>`<button class="deckrow" data-go="review"><span class="deckglyph" style="background:${col}">${icon('deck')}</span><span class="decktext"><strong>${t}</strong><small>${s}</small></span><span class="due">${d}<small>新規 ${n}</small></span></button>`).join('')}</div><button class="widebutton" data-go="editor">＋ デッキの作成・読み込み</button>`}
function stats(){let num=period==='7日'?'284':period==='1年'?'14,826':'1,248';return `<div class="filters"><button data-toast="すべてのデッキを集計中">すべてのデッキ ▾</button>${['7日','30日','1年'].map(p=>`<button data-period="${p}" aria-pressed="${period===p}">${p}</button>`).join('')}</div><p class="eyebrow" style="margin-top:18px">選択期間：${period} · サンプルデータ</p>${metrics([[num,'回答回数'],['92.4%','正答率','green'],['14日','連続学習','blue']])}<div class="charts"><section class="panel"><h2>学習の記録</h2><p>回答回数 / 日</p>${chart()}<div class="legend"><span><b style="background:var(--blue)"></b>復習</span><span><b style="background:var(--green)"></b>学習・再学習</span></div></section><section class="panel"><h2>続けた日々</h2><p>45日間の回答カレンダー</p>${heat()}<p style="margin-top:24px">マスを選ぶと、その日の学習量を確認。</p></section><section class="panel"><h2>これからの復習</h2><p>予定枚数 / 日 · 期限超過16枚は別集計</p>${chart([68,52,41,57,39,47,44],['今日','7','8','9','10','11','12'])}</section><section class="panel"><h2>回答の内訳</h2><p>回答回数。ユニークなカード数とは異なります。</p>${answers()}</section><section class="panel"><h2>実測の定着率</h2><p>同じカードの、その日最初の復習で集計</p>${metrics([['91.8%','実測','green'],['90%','FSRS目標','blue']])}<p>未成熟90.2% / 成熟93.8%</p></section><section class="panel"><h2>FSRS：記憶の安定性</h2><p>カード数 / 安定性の日数</p>${chart([24,57,108,83,58,34,19],['1日','3','7','14','30','90','1年'])}</section></div>`}
function browse(){return `<div class="browsergrid"><section><label class="searchbox">${icon('browse')}<input id="query" aria-label="カードを検索" placeholder="単語・意味を検索"><button data-toast="フィルター設計：M07">☰</button></label><div class="filters" style="margin-top:14px"><button data-toast="復習待ち48枚のサンプルを表示">復習待ち 48</button><button data-toast="タグ：vocabulary">タグ</button></div><div class="results" id="results"></div></section><section class="panel inspector"><h2>カードのプレビュー</h2><p>基本（表裏） · 英語・毎日のことば</p><div class="flashcard"><div class="word" id="selectedWord">${selected}</div><div class="translation" id="selectedMeaning">${vocab.find(v=>v[0]===selected)[1]}</div></div><button class="primary widebutton" data-go="editor">ノートを編集</button></section></div>`}
function fillResults(q=''){const list=vocab.filter(v=>v.join(' ').toLowerCase().includes(q.toLowerCase()));document.querySelector('#results').innerHTML=list.length?list.map(([a,b])=>`<button class="result ${a===selected?'active':''}" data-select="${a}"><span><strong>${a}</strong><small>${b}</small></span><span>今日</span></button>`).join(''):'<p class="galleryhelp">該当するカードはありません。検索語を変更してください。</p>'}
function review(){return `<div class="reviewwrap"><p class="eyebrow">英語・毎日のことば · 12 新規 / 8 学習 / 48 復習</p><div class="progress"><i></i></div><section class="panel flashcard"><span class="tag">EN → JP</span><div class="word">serendipity</div><div class="pronunciation">/ˌser.ənˈdɪp.ə.ti/</div><button class="secondary" data-toast="音声操作のデザイン例です">▷ 音声を再生</button>${revealed?'<div class="translation">思いがけない幸運</div><div class="example">A beautiful discovery by chance.</div>':'<p style="margin:40px 0 0">思い出してから、答えを確認</p>'}</section>${revealed?`<div class="rating">${[['もう一度','1分'],['難しい','6分'],['普通','1日'],['簡単','4日']].map(([l,t])=>`<button data-rating="${l}"><small>${t}</small>${l}</button>`).join('')}</div>`:'<button class="primary widebutton" id="reveal">答えを見る</button>'}<div class="reviewtools"><button id="undo">↶ 元に戻す</button><button data-go="editor">編集</button><button data-go="settings">ツール</button></div></div>`}
function editor(){return `<div class="editgrid"><form id="editor"><div class="filters"><button type="button" data-toast="基本・逆方向・穴埋め・画像穴埋めを選択">基本（表裏） ▾</button><button type="button" data-toast="保存先：英語">英語 ▾</button></div><div class="field"><label for="front">表面</label><textarea id="front" rows="3">serendipity</textarea></div><div class="field"><label for="back">裏面</label><textarea id="back" rows="4">思いがけない幸運\nA beautiful discovery by chance.</textarea></div><div class="toolbar"><button type="button" data-toast="書式：太字">B</button><button type="button" data-toast="書式：斜体">I</button><button type="button" data-toast="画像・録音・ファイル：M39">メディア</button><button type="button" data-toast="HTML編集：M12">&lt;/&gt;</button></div><div class="field"><label for="tags">タグ</label><input id="tags" value="vocabulary unit-04"></div><button class="primary widebutton" type="submit">ノートを保存</button></form><section class="panel editpreview"><h2>プレビュー</h2><p>保存前に表面と裏面を確認</p><div class="flashcard"><div class="word" id="previewFront">serendipity</div><div class="translation" id="previewBack">思いがけない幸運</div></div></section></div>`}
function settings(){return `<div class="settings">${[['学習と表示',[['学習画面と音声','M21'],['タップ・スワイプ','M22'],['キーボード・ゲームパッド','M23'],['表示・通知・一般','M21G']]],['アカウントとデータ',[['AnkiWebと同期','M24'],['プロフィール','M35'],['バックアップと保守','M36'],['追加・読み込み・書き出し','M27']]],['高度な学習',[['FSRS・学習オプション','M30'],['カスタム学習','M33'],['ヘルプと外部連携','M42']]]].map(([t,ls])=>`<h2>${t}</h2>${ls.map(([l,id])=>`<button class="setting" data-proof="${id}"><span>${l}</span><span>›</span></button>`).join('')}`).join('')}</div>`}
function catalog(){return '<p class="galleryhelp">Penpotの全画面と対応するSVGを閲覧できます。iPhone・iPad・画面幅別・ダーク・エラー状態を含みます。</p><div class="proofmenu">'+(window.SCREEN_INDEX||[]).map(s=>`<button data-proof="${s.id}">${s.id} · ${s.title}</button>`).join('')+'</div>'}
function showProof(id){const s=(window.SCREEN_INDEX||[]).find(s=>s.id===id);if(!s){toast('画面一覧を読み込んでください');return}document.querySelector('#pageTitle').textContent=s.title;document.querySelector('#main').innerHTML=`<button data-go="catalog">‹ 全画面に戻る</button><p class="galleryhelp">${s.id} · ${s.width} × ${s.height} pt · 編集可能なPenpot原稿に対応</p><img class="screenproof" alt="${s.title}の画面設計" src="proofs/${id}.svg">`;current='catalog';}
function render(page=current){current=page;document.querySelector('#pageTitle').textContent=names[page];document.querySelector('#screenSelect').value=page;document.querySelector('#main').innerHTML=({deck,browse,review,editor,stats,settings,catalog}[page]||deck)();for(const id of ['sidenav','tabs'])document.getElementById(id).innerHTML=['deck','browse','stats','settings'].map(k=>`<button class="nav ${page===k?'active':''}" data-go="${k}" ${page===k?'aria-current="page"':''}>${icon(k)}<span>${names[k]}</span></button>`).join('');if(page==='browse')fillResults();window.scrollTo(0,0)}
let toastTimer;function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)render(b.dataset.go);if(b.dataset.toast)toast(b.dataset.toast);if(b.dataset.period){period=b.dataset.period;render()}if(b.id==='reveal'){revealed=true;render()}if(b.id==='undo'){revealed=false;render()}if(b.dataset.rating){toast(b.dataset.rating+'を選択しました（デモ）');revealed=false;render()}if(b.dataset.select){selected=b.dataset.select;if(innerWidth<1024)render('editor');else{document.querySelector('#selectedWord').textContent=selected;document.querySelector('#selectedMeaning').textContent=vocab.find(v=>v[0]===selected)[1];fillResults(document.querySelector('#query').value)}}if(b.dataset.proof)showProof(b.dataset.proof);if(b.id==='theme'){document.body.classList.toggle('dark');b.setAttribute('aria-pressed',document.body.classList.contains('dark'))}if(b.id==='textsize'){document.body.classList.toggle('large');b.setAttribute('aria-pressed',document.body.classList.contains('large'))}});
document.addEventListener('input',e=>{if(e.target.id==='query')fillResults(e.target.value);if(e.target.id==='front')document.querySelector('#previewFront').textContent=e.target.value;if(e.target.id==='back')document.querySelector('#previewBack').textContent=e.target.value.split('\n')[0]});
document.addEventListener('submit',e=>{if(e.target.id==='editor'){e.preventDefault();toast('ノートを保存しました（デモ）');render('browse')}});
document.querySelector('#screenSelect').addEventListener('change',e=>render(e.target.value));
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(current==='review'&&e.code==='Space'){e.preventDefault();revealed=!revealed;render()}if(current==='review'&&revealed&&'1234'.includes(e.key)){toast('回答を選択しました（デモ）');revealed=false;render()}});
function widthLabel(){document.getElementById('widthLabel').textContent=innerWidth+'px / '+(innerWidth<600?'コンパクト':innerWidth<744?'1ペイン':innerWidth<1024?'サイドバー':'複数ペイン')};addEventListener('resize',widthLabel);widthLabel();render();
</script><script src="screen-index.js"></script></html>
