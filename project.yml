name: Negoto
options:
  bundleIdPrefix: io.github.keewai704
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  NegotoCore:
    path: NegotoCore
targets:
  Negoto:
    type: application
    platform: iOS
    sources:
      - path: Negoto/Sources
      - path: Negoto/Resources
        buildPhase: resources
      - path: Negoto/Negoto.entitlements
        buildPhase: none
    dependencies:
      - package: NegotoCore
    scheme:
      testTargets: [NegotoUITests]
    info:
      path: Negoto/Info.plist
      properties:
        CFBundleDisplayName: Negoto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        NSUbiquitousContainers:
          iCloud.io.github.keewai704.negoto:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Negoto
            NSUbiquitousContainerSupportedFolderLevels: Any
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki Deck Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.ankiweb.apkg]
          - CFBundleTypeName: Anki Collection Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.ankiweb.colpkg]
          - CFBundleTypeName: Anki Collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.ankiweb.anki2]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.ankiweb.apkg
            UTTypeDescription: Anki Deck Package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [apkg]
              public.mime-type: [application/apkg]
          - UTTypeIdentifier: net.ankiweb.colpkg
            UTTypeDescription: Anki Collection Package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [colpkg]
          - UTTypeIdentifier: net.ankiweb.anki2
            UTTypeDescription: Anki Collection
            UTTypeConformsTo: [public.data, public.database]
            UTTypeTagSpecification:
              public.filename-extension: [anki2, anki21, anki21b]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keewai704.negoto
        PRODUCT_NAME: Negoto
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        LOCALIZATION_PREFERS_STRING_CATALOGS: false

  NegotoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NegotoUITests
    dependencies:
      - target: Negoto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keewai704.negoto.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
